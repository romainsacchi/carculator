[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carculator"
dynamic = ["version"]
description = "Prospective life cycle assessment of passenger cars"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Romain Sacchi", email = "romain.sacchi@psi.ch"}, {name = "Chris Mutel", email = "christopher.mutel@psi.ch"}]
dependencies = ["carculator_utils>=1.3.7"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: BSD License",
]

[project.urls]
Homepage = "https://github.com/Laboratory-for-Energy-Systems-Analysis/carculator"
Documentation = "https://carculator.readthedocs.io/"
Changelog = "https://github.com/Laboratory-for-Energy-Systems-Analysis/carculator/blob/master/CHANGELOG.md"
Issues = "https://github.com/Laboratory-for-Energy-Systems-Analysis/carculator/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov", "hypothesis>=6", "openpyxl", "xlsxwriter"]
docs = ["sphinx", "sphinx-immaterial", "sphinx-copybutton", "sphinxcontrib-bibtex"]
excel = ["carculator_utils[excel]>=1.3.7"]
brightway = ["carculator_utils[brightway]>=1.3.7"]

[tool.setuptools.dynamic]
version = {attr = "carculator._version.VERSION"}

[tool.setuptools.packages.find]
include = ["carculator", "carculator.*"]

[tool.setuptools.package-data]
carculator = ["data/*.json", "data/*.yaml", "data/*.yml", "data/*.csv", "data/*.npz", "data/*.xlsx", "data/**/*.json", "data/**/*.yaml", "data/**/*.yml", "data/**/*.csv", "data/**/*.npz", "data/**/*.xlsx"]

[tool.setuptools.exclude-package-data]
"*" = ["**/.DS_Store", "**/__pycache__/*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
